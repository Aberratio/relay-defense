name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (mechanics, levels proven winnable, careless play loses)
        run: npm test
      - name: Build
        run: npm run build
      - name: Language check (English outside the Polish UI strings)
        run: npm run check:language
      - name: Wording check (built game and docs)
        run: npm run check:wording
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run smoke
      - name: Install WebKit and Firefox
        run: npx playwright install --with-deps webkit firefox
      - name: Determinism (every replay identical in Node, WebKit and Firefox)
        run: npm run determinism
